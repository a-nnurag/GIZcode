services:
  - type: web
    name: atlas-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://a-nnurag.github.io,http://localhost:5173
      - key: PORT
        value: 8787
      - key: GROQ_API_KEY
        sync: false
      - key: CHAT_MODEL
        value: openai/gpt-oss-120b
      - key: UPSTASH_VECTOR_REST_URL
        sync: false
      - key: UPSTASH_VECTOR_REST_TOKEN
        sync: false
